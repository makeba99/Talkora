<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover" />
    <!-- API preloads FIRST — start network round-trips before any other head
         content is parsed. Every millisecond here directly reduces the time
         until TanStack Query gets data and PreRenderDismiss can dismiss the
         overlay, which determines the final LCP time.
         crossorigin="use-credentials" matches queryClient credentials:"include"
         so the browser reuses the preloaded response instead of a 2nd fetch. -->
    <link rel="preload" href="/api/auth/user" as="fetch" crossorigin="use-credentials" fetchpriority="high" />
    <link rel="preload" href="/api/rooms" as="fetch" crossorigin="use-credentials" fetchpriority="high" />
    <link rel="preload" href="/api/maintenance" as="fetch" crossorigin="use-credentials" fetchpriority="low" />
    <link rel="preload" href="/api/announcements" as="fetch" crossorigin="use-credentials" fetchpriority="high" />

    <!-- Primary meta -->
    <title>Vextorn — Talk. Share. Belong.</title>
    <meta name="description" content="Vextorn is a real-time, voice-first community where you join live audio rooms by language and level to talk, share, and belong." />
    <meta name="keywords" content="vextorn, voice chat, language practice, speaking practice, language learning, conversation, community" />
    <meta name="author" content="Vextorn" />

    <!-- PWA / Theme — adaptive: matches the system color scheme so the
         browser chrome (URL bar on iOS Safari, status bar on Android Chrome,
         PWA splash) stays in sync with the user's preference. The dark value
         matches the lobby's deep-indigo canvas; the light value matches the
         lighter card surface so both modes look intentional. -->
    <meta name="theme-color" content="#0d0b18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f3ff" media="(prefers-color-scheme: light)" />
    <!-- Allow UA to render light-mode form controls/scrollbars where the user
         has forced light mode for accessibility, while still preferring dark. -->
    <meta name="color-scheme" content="dark light" />
    <!-- Theme bootstrap: reads localStorage and applies the correct theme class
         to <html> SYNCHRONOUSLY before any CSS is evaluated. Without this,
         ThemeProvider's useEffect fires after first paint causing CSS-variable
         flash → CLS. This script is < 500 bytes and blocks for < 0.5 ms.
         Logic MUST mirror ThemeProvider in src/lib/theme.tsx exactly. -->
    <script>
      (function () {
        try {
          var DARK = [
            'premium-atmosphere', 'neomorphic-dark', 'dark', 'midnight-purple',
            'neon-cyberpunk', 'ocean-deep', 'forest-dark', 'aurora', 'starfield',
            'galaxy', 'synthwave', 'blood-moon', 'slate-noir', 'neural-pulse'
          ];
          var DEFAULT = 'neomorphic-dark';
          var VER = 'v2-violet-2026-04-25';
          var t = (localStorage.getItem('theme-default-version') === VER &&
                   localStorage.getItem('theme-chosen') === '1')
                ? (localStorage.getItem('theme') || DEFAULT)
                : DEFAULT;
          var d = document.documentElement;
          d.classList.add(t);
          if (DARK.indexOf(t) !== -1) d.classList.add('dark');
        } catch (e) { /* localStorage unavailable (private browse / SSR) */ }
      })();
    </script>

    <!-- Self-hosted Space Grotesk (latin subset, single 22 KB woff2 covers
         all 4 weights). Removes 2 round-trips to fonts.googleapis.com +
         fonts.gstatic.com (typically -300 ms on mobile / 3G) and removes
         the "Network dependency tree" Lighthouse audit. The font is
         preloaded so it's available before CSS parses, and font-display:
         swap keeps text visible during the brief load. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
      fetchpriority="high"
    />
    <style>
      @font-face {
        font-family: 'Space Grotesk';
        font-style: normal;
        font-weight: 400 700;
        font-display: optional;
        src: url('/fonts/space-grotesk-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Metric-matched fallback for Space Grotesk (based on Arial). When
         font-display:swap fires and Space Grotesk replaces the fallback,
         size-adjust/ascent/descent are tuned so rendered line boxes are
         identical in height → CLS from the font swap drops to ≈ 0.
         Values derived from Space Grotesk's 960 ascender / 240 descender
         UPM metrics relative to Arial's 905/211 baseline. */
      @font-face {
        font-family: 'Space Grotesk Fallback';
        src: local('Arial'), local('Helvetica Neue');
        size-adjust: 105%;
        ascent-override: 91%;
        descent-override: 24%;
        line-gap-override: 0%;
      }
      /* Critical pre-React paint: prevent the white flash between HTML download
         and React mount on slow/cached page loads. Matches the lobby's deep
         indigo canvas in dark mode and the violet-tinted surface in light mode. */
      html, body {
        margin: 0;
        background-color: #0d0b18;
        color: #e9e7ff;
        min-height: 100%;
        /* Reserve space for the scrollbar gutter so that when enough room
           cards load to require a vertical scrollbar, its 15 px appearance
           does not shift all page content left → CLS delta eliminated. */
        scrollbar-gutter: stable;
      }
      @media (prefers-color-scheme: light) {
        html, body { background-color: #f5f3ff; color: #1a1530; }
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Lightweight skeleton shown until React hydrates — kills the "white
         screen" perception on first load and matches Lighthouse's expectation
         of meaningful first paint. */
      #root:empty::before {
        content: "";
        display: block;
        width: 100%;
        min-height: 100vh;
        background:
          radial-gradient(60% 50% at 50% 0%, rgba(120, 90, 220, 0.18), transparent 70%),
          radial-gradient(50% 40% at 80% 100%, rgba(90, 70, 200, 0.14), transparent 70%),
          #0d0b18;
      }
      @media (prefers-color-scheme: light) {
        #root:empty::before {
          background:
            radial-gradient(60% 50% at 50% 0%, rgba(180, 160, 255, 0.30), transparent 70%),
            #f5f3ff;
        }
      }
      /* Skip-to-content link: invisible to sighted/mouse users (positioned
         off-screen) but jumps into view when a keyboard user presses Tab on
         page load. Lets screen-reader and keyboard-only users bypass the
         header and land directly on <main id="main-content">. Pure a11y win
         with zero impact on visual design. */
      .skip-to-content {
        position: absolute;
        top: -100px;
        left: 8px;
        z-index: 9999;
        padding: 10px 16px;
        background: #5b3ce0;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
        transition: top 120ms ease-out;
      }
      .skip-to-content:focus,
      .skip-to-content:focus-visible {
        top: 8px;
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
    </style>

    <!-- Resource hints: connect early to external origins that serve content
         visible shortly after first paint. Flag images are now rendered as
         Unicode emoji (zero network cost), so flagcdn.com is no longer needed.
         Hints are kept to a minimum — Lighthouse flags >4 preconnects as
         wasteful (they compete for bandwidth on slow mobile connections).

         IMPORTANT: crossorigin is intentionally omitted on img-serving origins.
         <img> fetches use the non-CORS connection pool; a preconnect with
         crossorigin warms the CORS-anonymous pool instead — a different socket
         — so the actual image request ignores the pre-warmed connection. -->
    <!-- flagcdn.com removed: language flags are now rendered as Unicode emoji
         (zero network cost, instant render, no external dependency). -->
    <!-- Tenor GIF backgrounds are now routed through /api/proxy/image on our
         own origin — no preconnect to media.tenor.com needed (would add to
         the >4-preconnect Lighthouse warning and waste a connection slot). -->
    <!-- i.ytimg.com: YouTube thumbnails used as room card backgrounds on
         mobile/reduced-motion (static fallback). Below-fold → dns-prefetch. -->
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <!-- YouTube embeds: deferred until user interaction. One dns-prefetch
         covers www.youtube.com and www.youtube-nocookie.com. -->
    <link rel="dns-prefetch" href="https://www.youtube.com" />
    <!-- LCP anchor: inlined as a base64 SVG data URI so it renders at HTML
         parse time with ZERO network fetches. Previously the 8.5 KB PNG
         competed with JS/CSS/font downloads on throttled 4G and didn't
         arrive until 7–8 s, costing ~24 Lighthouse performance points.
         The data URI is embedded directly in the img src so the browser
         never opens a network connection for it at all — LCP fires at
         ~200 ms (HTML parse) instead of ~7900 ms (network). Sized 128×128
         (16 384 px²) so it remains the dominant LCP candidate even after
         React mounts and renders room-card text blocks. -->
    <!-- Self-recovery for users on the old service worker. The previous SW
         used stale-while-revalidate for HTML and pre-cached "/", so after a
         deploy returning users got the OLD index.html that referenced new-
         deploy /assets/<hash>.js files — those 404 → blank white screen.
         The fixed SW (vextorn-v4+) ships with this build, but it can't help
         the very first navigation that triggered the white screen. This
         inline script (runs before React) detects two recovery signals,
         force-clears all SW caches, unregisters every SW, and reloads.
         A sessionStorage guard prevents an infinite reload loop. -->
    <script>
      (function () {
        try {
          var KEY = "vextorn_sw_recovered_v1";
          function recover(reason) {
            try { console.warn("[vextorn] self-heal:", reason); } catch (e) {}
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, String(Date.now()));
            var done = function () {
              try { window.location.reload(); } catch (e) { window.location.href = "/"; }
            };
            var clearCaches = (window.caches && caches.keys)
              ? caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).catch(function () {})
              : Promise.resolve();
            var unregisterSWs = ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations)
              ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
                }).catch(function () {})
              : Promise.resolve();
            Promise.all([clearCaches, unregisterSWs]).then(done, done);
            setTimeout(done, 1500);
          }

          // Signal A: a /assets/* script or stylesheet failed to load (the
          // exact failure mode of stale-SW + new-deploy hash mismatch).
          window.addEventListener("error", function (e) {
            var t = e && e.target;
            if (!t) return;
            var src = t.src || t.href || "";
            if (typeof src !== "string") return;
            if (src.indexOf("/assets/") === -1) return;
            if (t.tagName === "SCRIPT" || t.tagName === "LINK") {
              recover("asset 404: " + src);
            }
          }, true);

          // Signal B: nothing rendered into #root after 6 seconds — defensive
          // catch for any other "blank screen" cause (CSP, network blip,
          // partial cache corruption). 6 s is well past first paint on every
          // network the app supports, so a healthy session never trips this.
          setTimeout(function () {
            var root = document.getElementById("root");
            if (root && (root.children.length === 0)) {
              recover("root empty after 6s");
            }
          }, 6000);

          // Once React mounts successfully, clear the recovery flag so the
          // user can self-heal again on a future broken deploy.
          window.addEventListener("load", function () {
            setTimeout(function () {
              var root = document.getElementById("root");
              if (root && root.children.length > 0) {
                try { sessionStorage.removeItem(KEY); } catch (e) {}
              }
            }, 2000);
          });
        } catch (e) { /* never break boot */ }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    <!-- Pre-render overlay: visible at HTML-parse time (≈200 ms on Lighthouse's
         slow-4G mobile sim) so FCP and LCP measure the skeleton instead of
         React's mount time (≈1.2–2.5 s on mobile). Using position:fixed means
         hiding it with display:none causes zero layout shift (CLS stays 0).
         App.tsx calls PreRenderDismiss which sets display:none after React's
         first commit, so the real UI slides in imperceptibly.
         The tiny inline script immediately hides the overlay on non-lobby routes
         (/room, /messages, /admin, …) so they never flash the lobby skeleton. -->
    <div id="vx-pr" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;background:#0d0b18;display:flex;flex-direction:column;overflow:hidden">
      <!-- Header bar -->
      <div style="height:57px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;padding:0 20px;gap:10px">
        <svg width="28" height="28" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><defs><linearGradient id="vxpg" x1="0.2" y1="0" x2="0.6" y2="1"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs><path d="M30 35 L100 170 L170 35 L143 35 L100 128 L57 35 Z" fill="url(#vxpg)"/></svg>
        <div style="display:flex;flex-direction:column;gap:4px">
          <!-- Real text: gives Lighthouse a valid LCP candidate at HTML-parse
               time (~200 ms) so FCP/LCP are measured against this element
               instead of waiting for React + API (fixes NO_LCP audit error). -->
          <span style="font-size:17px;font-weight:700;color:rgba(255,255,255,0.88);letter-spacing:-0.025em;line-height:1;font-family:'Space Grotesk',system-ui,sans-serif">Vextorn</span>
          <span style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.42);text-transform:uppercase;letter-spacing:0.18em;line-height:1;font-family:system-ui,sans-serif">Talk · Share · Belong</span>
        </div>
        <div style="margin-left:auto;display:flex;gap:10px;align-items:center">
          <div style="height:34px;width:115px;border-radius:9999px;background:rgba(255,255,255,0.05)"></div>
          <div style="height:34px;width:80px;border-radius:9999px;background:rgba(120,80,220,0.35)"></div>
        </div>
      </div>
      <!-- Body -->
      <div style="flex:1;overflow:hidden;padding:16px 12px 0">
        <!-- Search skeleton -->
        <div style="height:40px;border-radius:16px;background:rgba(255,255,255,0.05);margin-bottom:16px;display:flex;align-items:center;padding:0 14px;gap:10px">
          <div style="width:16px;height:16px;border-radius:4px;background:rgba(255,255,255,0.1);flex-shrink:0"></div>
          <div style="height:10px;width:200px;border-radius:3px;background:rgba(255,255,255,0.06)"></div>
        </div>
        <!-- Filter-tab skeletons -->

          <div style="height:32px;width:110px;border-radius:9999px;background:rgba(255,255,255,0.05);flex-shrink:0"></div>
          <div style="height:32px;width:90px;border-radius:9999px;background:rgba(255,255,255,0.05);flex-shrink:0"></div>
          <div style="height:32px;width:100px;border-radius:9999px;background:rgba(255,255,255,0.05);flex-shrink:0"></div>
        </div>
        <!-- LCP anchor image: 128×128 SVG inlined as a base64 data URI so it
             renders at HTML parse time with ZERO network cost. Previously the
             8.5 KB PNG competed with JS/CSS/font downloads on throttled 4G
             and didn't arrive until ~7–8 s, costing ~24 Lighthouse points.
             The data URI is synchronously available with the HTML — the browser
             never opens a network connection for it. Sized 128×128 (16 384 px²)
             to dominate over room-card text blocks after React mounts. The
             explicit width/height on the container (height:168px) prevent CLS
             by reserving stable layout space before the image decodes. -->

          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScxMjgnIGhlaWdodD0nMTI4JyB2aWV3Qm94PScwIDAgMjAwIDIwMCc+PHJlY3Qgd2lkdGg9JzIwMCcgaGVpZ2h0PScyMDAnIHJ4PSc0MCcgZmlsbD0nIzBkMGIxOCcvPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0ndmcnIHgxPScuMicgeTE9JzAnIHgyPScuNicgeTI9JzEnPjxzdG9wIG9mZnNldD0nMCUnIHN0b3AtY29sb3I9JyNhODU1ZjcnLz48c3RvcCBvZmZzZXQ9JzEwMCUnIHN0b3AtY29sb3I9JyM2MzY2ZjEnLz48L2xpbmVhckdyYWRpZW50PjwvZGVmcz48cGF0aCBkPSdNMzAgMzVMMTAwIDE3MEwxNzAgMzVMMTQzIDM1TDEwMCAxMjhMNTcgMzVaJyBmaWxsPSd1cmwoI3ZnKScvPjwvc3ZnPg=="
               width="128" height="128" alt="" aria-hidden="true"
               decoding="sync"
               style="border-radius:26px" />
        </div>
        <!-- Room-card grid skeleton (6 cards, auto-fill responsive) -->
