<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sakuraRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="petalG" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="55%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#sakuraRim)" stroke-width="2.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(100,100)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      <g transform="translate(0,-70)">
        <ellipse cx="0" cy="0" rx="8" ry="5" fill="url(#petalG)" opacity="0.95"/>
        <ellipse cx="-3" cy="1" rx="4" ry="3" fill="#ffe4e6" opacity="0.7"/>
      </g>
      <g transform="rotate(72) translate(0,-70)">
        <ellipse cx="0" cy="0" rx="7.5" ry="4.8" fill="url(#petalG)" opacity="0.9"/>
      </g>
      <g transform="rotate(144) translate(0,-71)">
        <ellipse cx="0" cy="0" rx="8" ry="5" fill="url(#petalG)" opacity="0.92"/>
      </g>
      <g transform="rotate(216) translate(0,-70)">
        <ellipse cx="0" cy="0" rx="7" ry="4.5" fill="url(#petalG)" opacity="0.88"/>
      </g>
      <g transform="rotate(288) translate(0,-71)">
        <ellipse cx="0" cy="0" rx="8" ry="5" fill="url(#petalG)" opacity="0.93"/>
      </g>
    </g>
  </g>
  <circle cx="48" cy="52" r="1.3" fill="#fff">
    <animate attributeName="cy" values="52;38;52" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="58" r="1.1" fill="#fecdd3">
    <animate attributeName="cy" values="58;42;58" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.15;0.85" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
