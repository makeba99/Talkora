<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="fox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="36" y="36" width="128" height="128" rx="22" ry="22" stroke="#fb923c" stroke-width="2.8" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <!-- Fox ears peeking over top corners -->
  <g transform="translate(58,42)">
    <polygon points="0,34 -22,-10 20,-8" fill="url(#fox)">
      <animateTransform attributeName="transform" type="rotate" values="0;7;0;-5;0" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,24 -10,2 10,2" fill="#ffedd5"/>
  </g>
  <g transform="translate(142,42)">
    <polygon points="0,34 -20,-8 22,-10" fill="url(#fox)">
      <animateTransform attributeName="transform" type="rotate" values="0;-7;0;5;0" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,24 -10,2 10,2" fill="#ffedd5"/>
  </g>
  <circle cx="40" cy="100" r="1.8" fill="#fdba74">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="100" r="1.8" fill="#fdba74">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.35s" repeatCount="indefinite"/>
  </circle>
  <path d="M52,148 Q100,172 148,148" stroke="#fb923c" stroke-width="3.5" opacity="0.75"/>
  <circle cx="100" cy="162" r="5" fill="#fbbf24">
    <animate attributeName="r" values="4;5.5;4" dur="1.7s" repeatCount="indefinite"/>
  </circle>
</svg>
