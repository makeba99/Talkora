<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fireRim" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#fireRim)" stroke-width="3.2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="63" fill="none" stroke="#fdba74" stroke-width="1" opacity="0.35"/>
  <!-- Flame tongues around rim -->
  <g transform="translate(100,100)">
    <g transform="rotate(-30) translate(0,-62)">
      <path d="M0,8 Q-6,-2 0,-14 Q6,-2 0,8 Z" fill="url(#flame)" opacity="0.95">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.08,1.15;1,1" dur="0.7s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(0) translate(0,-64)">
      <path d="M0,10 Q-7,0 0,-18 Q7,0 0,10 Z" fill="url(#flame)">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.1,1.2;1,1" dur="0.65s" begin="0.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(30) translate(0,-62)">
      <path d="M0,8 Q-6,-2 0,-14 Q6,-2 0,8 Z" fill="url(#flame)" opacity="0.95">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.08,1.15;1,1" dur="0.72s" begin="0.15s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(90) translate(0,-61)">
      <path d="M0,6 Q-5,0 0,-10 Q5,0 0,6 Z" fill="#fb923c" opacity="0.85">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.12,1.18;1,1" dur="0.68s" begin="0.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(150) translate(0,-61)">
      <path d="M0,7 Q-5.5,-1 0,-12 Q5.5,-1 0,7 Z" fill="#f97316" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.1,1.16;1,1" dur="0.7s" begin="0.05s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(210) translate(0,-61)">
      <path d="M0,7 Q-5.5,-1 0,-12 Q5.5,-1 0,7 Z" fill="#ef4444" opacity="0.88">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.09,1.14;1,1" dur="0.66s" begin="0.25s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(270) translate(0,-61)">
      <path d="M0,6 Q-5,0 0,-10 Q5,0 0,6 Z" fill="#fbbf24" opacity="0.85">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.12,1.2;1,1" dur="0.6s" begin="0.12s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="rotate(330) translate(0,-61)">
      <path d="M0,7 Q-5.5,-1 0,-11 Q5.5,-1 0,7 Z" fill="#fb923c" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1,1;1.1,1.15;1,1" dur="0.7s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  <!-- Embers rising -->
  <circle cx="70" cy="55" r="1.5" fill="#fde68a">
    <animate attributeName="cy" values="55;35;55" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="50" r="1.2" fill="#fdba74">
    <animate attributeName="cy" values="50;30;50" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
