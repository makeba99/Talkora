<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="fur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Rim hugs the portrait edge so the cat sits around the card, not inside it -->
  <rect x="14" y="14" width="172" height="172" rx="38" ry="38" stroke="#fbbf24" stroke-width="3" opacity="0.75" filter="url(#soft)">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <!-- Sleeping cat perched on the top edge -->
  <g transform="translate(100,10)">
    <ellipse cx="0" cy="10" rx="32" ry="16" fill="url(#fur)"/>
    <ellipse cx="-20" cy="2" rx="8" ry="11" fill="#fbbf24" transform="rotate(-16)"/>
    <ellipse cx="20" cy="2" rx="8" ry="11" fill="#fbbf24" transform="rotate(16)"/>
    <circle cx="-20" cy="-5" r="2.4" fill="#fcd34d"/>
    <circle cx="20" cy="-5" r="2.4" fill="#fcd34d"/>
    <ellipse cx="0" cy="8" rx="12" ry="9" fill="#fef3c7"/>
    <path d="M-7,8 Q-3.5,12 0,8 Q3.5,12 7,8" stroke="#92400e" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="0" cy="12" rx="2.4" ry="1.6" fill="#fb7185"/>
    <path d="M28,12 Q44,0 40,-14" stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M28,12 Q44,0 40,-14;M28,12 Q46,6 42,-8;M28,12 Q44,0 40,-14" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <text x="24" y="-10" fill="#fde68a" font-size="12" font-family="Segoe UI,sans-serif" font-weight="700">
      z
      <animate attributeName="opacity" values="0.15;1;0.15" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-10;-20;-10" dur="1.8s" repeatCount="indefinite"/>
    </text>
    <text x="34" y="-18" fill="#fef3c7" font-size="9" font-family="Segoe UI,sans-serif" font-weight="700">
      z
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-18;-28;-18" dur="1.8s" begin="0.25s" repeatCount="indefinite"/>
    </text>
  </g>
  <g opacity="0.65">
    <ellipse cx="48" cy="158" rx="3.2" ry="2.4" fill="#fbbf24">
      <animate attributeName="opacity" values="0.25;0.85;0.25" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="152" cy="156" rx="3.2" ry="2.4" fill="#fbbf24">
      <animate attributeName="opacity" values="0.2;0.75;0.2" dur="2.2s" begin="0.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
