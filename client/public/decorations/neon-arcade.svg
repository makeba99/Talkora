<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="arcadeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#arcadeRim)" stroke-width="3.2" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 366;183 183;366 0;0 366" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="64" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="-360 100 100" dur="10s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(100,100)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      <rect x="-3" y="-76" width="6" height="10" rx="1.5" fill="#22d3ee" opacity="0.9"/>
      <rect transform="rotate(90)" x="-3" y="-76" width="6" height="10" rx="1.5" fill="#a78bfa" opacity="0.9"/>
      <rect transform="rotate(180)" x="-3" y="-76" width="6" height="10" rx="1.5" fill="#f472b6" opacity="0.9"/>
      <rect transform="rotate(270)" x="-3" y="-76" width="6" height="10" rx="1.5" fill="#34d399" opacity="0.9"/>
    </g>
  </g>
  <circle cx="55" cy="45" r="1.5" fill="#67e8f9">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="148" cy="48" r="1.4" fill="#f0abfc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="145" cy="150" r="1.3" fill="#6ee7b7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
