<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="petal" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#rim)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-width" values="2.5;3.5;2.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="63" fill="none" stroke="#f0abfc" stroke-width="1" opacity="0.4"/>
  <!-- Rose crown along top arc -->
  <g transform="translate(100,100)">
    <g transform="rotate(-55) translate(0,-68)">
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="url(#petal)" opacity="0.95"/>
      <ellipse cx="-4" cy="1" rx="5" ry="4" fill="#f5d0fe" opacity="0.7"/>
      <circle cx="0" cy="0" r="2" fill="#fce7f3"/>
    </g>
    <g transform="rotate(-20) translate(0,-70)">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="url(#petal)">
        <animate attributeName="ry" values="8;9;8" dur="2.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="3" cy="-1" rx="5" ry="4" fill="#fae8ff" opacity="0.65"/>
      <circle cx="0" cy="0" r="2.2" fill="#fce7f3"/>
    </g>
    <g transform="rotate(20) translate(0,-70)">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="url(#petal)">
        <animate attributeName="ry" values="8;9.2;8" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="-3" cy="-1" rx="5" ry="4" fill="#fae8ff" opacity="0.65"/>
      <circle cx="0" cy="0" r="2.2" fill="#fce7f3"/>
    </g>
    <g transform="rotate(55) translate(0,-68)">
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="url(#petal)" opacity="0.95"/>
      <ellipse cx="4" cy="1" rx="5" ry="4" fill="#f5d0fe" opacity="0.7"/>
      <circle cx="0" cy="0" r="2" fill="#fce7f3"/>
    </g>
    <!-- Side buds -->
    <g transform="rotate(110) translate(0,-66)">
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="#c026d3" opacity="0.85"/>
      <circle cx="0" cy="0" r="1.5" fill="#f5d0fe"/>
    </g>
    <g transform="rotate(-110) translate(0,-66)">
      <ellipse cx="0" cy="0" rx="6" ry="5" fill="#c026d3" opacity="0.85"/>
      <circle cx="0" cy="0" r="1.5" fill="#f5d0fe"/>
    </g>
    <g transform="rotate(180) translate(0,-65)">
      <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#a21caf" opacity="0.8"/>
      <circle cx="0" cy="0" r="1.6" fill="#fce7f3"/>
    </g>
  </g>
  <circle cx="48" cy="42" r="1.3" fill="#fce7f3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="40" r="1.3" fill="#e879f9">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
</svg>
