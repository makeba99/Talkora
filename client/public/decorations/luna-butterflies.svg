<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="wing" cx="35%" cy="40%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="55%" stop-color="rgba(165,243,252,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Transparent center hole so avatar shows through (Free4Talk / Discord overlay technique) -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#ring)" stroke-width="3.5" opacity="0.95" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="64" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.35"/>
  <!-- Butterflies around the ring -->
  <g>
    <g transform="translate(100,100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(0,-72)">
          <ellipse cx="-5" cy="0" rx="8" ry="5" fill="url(#wing)" transform="rotate(-25)">
            <animate attributeName="rx" values="8;5;8" dur="0.55s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="5" cy="0" rx="8" ry="5" fill="url(#wing)" transform="rotate(25)">
            <animate attributeName="rx" values="8;5;8" dur="0.55s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="0" r="1.6" fill="#e0e7ff"/>
        </g>
        <g transform="rotate(60) translate(0,-70)">
          <ellipse cx="-4.5" cy="0" rx="7" ry="4.5" fill="#c4b5fd" opacity="0.85" transform="rotate(-25)">
            <animate attributeName="rx" values="7;4;7" dur="0.5s" begin="0.1s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="4.5" cy="0" rx="7" ry="4.5" fill="#67e8f9" opacity="0.85" transform="rotate(25)">
            <animate attributeName="rx" values="7;4;7" dur="0.5s" begin="0.1s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="0" r="1.4" fill="#fff"/>
        </g>
        <g transform="rotate(130) translate(0,-74)">
          <ellipse cx="-5" cy="0" rx="7.5" ry="5" fill="#a5b4fc" opacity="0.9" transform="rotate(-20)">
            <animate attributeName="rx" values="7.5;4.5;7.5" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="5" cy="0" rx="7.5" ry="5" fill="#22d3ee" opacity="0.75" transform="rotate(20)">
            <animate attributeName="rx" values="7.5;4.5;7.5" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="0" r="1.5" fill="#e0f2fe"/>
        </g>
        <g transform="rotate(200) translate(0,-71)">
          <ellipse cx="-4" cy="0" rx="6.5" ry="4" fill="#ddd6fe" opacity="0.9" transform="rotate(-22)">
            <animate attributeName="rx" values="6.5;3.5;6.5" dur="0.48s" begin="0.15s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="4" cy="0" rx="6.5" ry="4" fill="#67e8f9" opacity="0.8" transform="rotate(22)">
            <animate attributeName="rx" values="6.5;3.5;6.5" dur="0.48s" begin="0.15s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="0" r="1.3" fill="#fff"/>
        </g>
        <g transform="rotate(280) translate(0,-73)">
          <ellipse cx="-5" cy="0" rx="8" ry="5" fill="#c084fc" opacity="0.8" transform="rotate(-28)">
            <animate attributeName="rx" values="8;5;8" dur="0.52s" begin="0.25s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="5" cy="0" rx="8" ry="5" fill="#818cf8" opacity="0.8" transform="rotate(28)">
            <animate attributeName="rx" values="8;5;8" dur="0.52s" begin="0.25s" repeatCount="indefinite"/>
          </ellipse>
          <circle cx="0" cy="0" r="1.5" fill="#f5f3ff"/>
        </g>
      </g>
    </g>
  </g>
  <!-- Soft sparkles -->
  <circle cx="42" cy="48" r="1.5" fill="#fff" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="158" cy="55" r="1.2" fill="#a5f3fc" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="145" r="1.4" fill="#e9d5ff" opacity="0.8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
</svg>
